# Conda Environment for FCLGA GraphTransformer
# 
# Installation:
#   conda env create -f environment.yml
#   conda activate fclga
#
# Update existing environment:
#   conda env update -f environment.yml --prune

name: fclga
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Scientific Computing
  - numpy
  - scipy
  
  # Data Processing
  - pandas
  
  # Visualization
  - matplotlib
  - seaborn
  
  # Configuration
  - pyyaml
  
  # Progress bars
  - tqdm

  # Testing
  - pytest
  - pytest-cov

  # Code Quality Tools (flexible versions)
  - black
  - isort
  - flake8

  # Utilities
  - python-dateutil

  # Additional packages via pip (if not available in conda)
  - pip
  - pip:
    - torch>=2.0.0
    - torchvision
    - torchaudio
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch-geometric
    - torch-scatter
    - torch-sparse
    - torch-cluster
    - optuna>=3.0.0  # Hyperparameter optimization
    - plotly  # Optuna visualization
    - kaleido  # Plotly image export
    - scikit-learn  # Optuna parameter importance

# Platform-specific notes:
# 
# This configuration works with CUDA 11.7+ including 12.x
# The pytorch-cuda package is flexible and compatible with your driver
#
# For CPU-only (no CUDA):
#   Remove pytorch-cuda line, conda will install CPU version automatically
#
# Check your CUDA version:
#   nvidia-smi  # Shows CUDA version
#   conda search pytorch -c pytorch  # Shows available versions
